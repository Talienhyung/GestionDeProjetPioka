# Base PostgreSQL pour le développement et les tests, sur le poste.
#   docker compose -f docker-compose.dev.yml up -d
# Les tests créent leurs propres bases jetables sur ce même serveur.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cap
      POSTGRES_PASSWORD: cap
      POSTGRES_DB: cap
    ports:
      - "5432:5432"
    volumes:
      - cap-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cap"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  cap-dev-db:
