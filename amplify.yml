# Build AWS Amplify Hosting (SSR, Next.js 15).
#
# Variables à définir dans la console Amplify (Hosting > Environment variables) :
#   DYNAMODB_TABLE    table DynamoDB des données (ex. notre-cap)
#   DYNAMODB_REGION   région de la table (ex. eu-west-3)
#   S3_BUCKET         bucket privé des photos
#   S3_REGION         région du bucket (ex. eu-west-3)
#
# Les accès DynamoDB et S3 passent par le rôle de calcul SSR de l'app (IAM),
# pas par des clés d'accès. Aucune base à migrer : l'amorçage (badges,
# catalogue, super admin) se lance une fois depuis un poste, voir
# docs/deploiement-amplify.md.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - node --version
        - npm ci
    build:
      commands:
        # Le serveur Next.js d'Amplify ne voit pas les variables de la console :
        # on recopie dans .env.production celles dont il a besoin à l'exécution.
        - env | grep -E '^(DYNAMODB_TABLE|DYNAMODB_REGION|S3_BUCKET|S3_REGION)=' >> .env.production
        - npx prisma generate
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
