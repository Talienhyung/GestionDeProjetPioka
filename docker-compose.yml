# Hébergement sur ton propre serveur : un seul conteneur, données et photos
# sur le volume cap-data. Pour AWS Amplify, voir docs/deploiement-amplify.md.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Définis SUPER_ADMIN_PASSWORD dans .env}
    volumes:
      - cap-data:/data

volumes:
  cap-data:
